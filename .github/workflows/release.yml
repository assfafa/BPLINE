name: Publish Library Release

# 两个库分别按标签发布；普通提交不触发 Release。
on:
    push:
        tags:
            - "bplinejs-v*"
            - "bpmatrixjs-v*"

permissions:
    contents: read

concurrency:
    group: library-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write

        steps:
            - name: Checkout tagged source
              # actions/checkout v7，固定提交避免上游标签变动改变发布行为。
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Validate version and release notes
              id: metadata
              shell: bash
              run: |
                  set -euo pipefail

                  # 限制标签形态，避免把错误版本或路径当作发布说明读取。
                  if [[ "$GITHUB_REF_NAME" =~ ^(bplinejs|bpmatrixjs)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
                      package="${BASH_REMATCH[1]}"
                      version="${BASH_REMATCH[2]}"
                  else
                      echo "Invalid library release tag: $GITHUB_REF_NAME"
                      exit 1
                  fi

                  if [ "$package" = "bplinejs" ]; then
                      directory="BPLineJS"
                  else
                      directory="BPMatrixJS"
                  fi
                  package_version="$(node -p "require('./${directory}/package.json').version")"
                  notes="${directory}/releases/${version}.md"

                  # 标签必须指向这个版本的源码，不能给旧提交误打新版本标签。
                  if [ "$version" = "$package_version" ]; then
                      echo "Release version: $version"
                  else
                      echo "Tag version $version does not match package version $package_version"
                      exit 1
                  fi

                  # 缺少说明或空文件时停止，禁止创建空白 Release。
                  if [ -s "$notes" ]; then
                      echo "Release notes: $notes"
                  else
                      echo "Missing or empty release notes: $notes"
                      exit 1
                  fi
                  echo "directory=$directory" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "notes=$notes" >> "$GITHUB_OUTPUT"

            - name: Publish GitHub release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_DIRECTORY: ${{ steps.metadata.outputs.directory }}
                  RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
                  RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
              run: |
                  set -euo pipefail

                  options=()

                  # beta 等预发布版本不占用正式 latest 标记。
                  if [[ "$RELEASE_VERSION" == *-* ]]; then
                      options+=(--prerelease --latest=false)
                  elif [ "$RELEASE_DIRECTORY" = "BPLineJS" ]; then
                      options+=(--latest)
                  else
                      # 仓库默认 latest 保留给主渲染库，数学库仍是正式 Release。
                      options+=(--latest=false)
                  fi

                  # 重跑工作流时不覆盖已发布的说明，也不重复创建同名 Release。
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                      echo "Release already exists: $GITHUB_REF_NAME"
                  else
                      gh release create "$GITHUB_REF_NAME" \
                          --verify-tag \
                          --title "${RELEASE_DIRECTORY} ${RELEASE_VERSION}" \
                          --notes-file "$RELEASE_NOTES" \
                          "${options[@]}"
                  fi
